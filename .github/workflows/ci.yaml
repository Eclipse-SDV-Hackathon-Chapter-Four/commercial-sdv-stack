# Orchestrator workflow that launches every CI workflow together in a single
# run. Trigger it manually from the Actions tab (Run workflow) to execute the
# full CI suite at once; each job below calls an existing reusable workflow.

name: CI

on:
  workflow_dispatch:
  # TEMPORARY: fires a run on this branch so the workflow can be exercised
  # before it reaches the default branch. Remove before merging.
  push:
    branches:
    - ci/launch-all-workflows

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint source code
    uses: ./.github/workflows/lint_source_code.yaml

  check-dependencies:
    name: Check 3rd party dependencies
    uses: ./.github/workflows/check-dependencies.yaml
