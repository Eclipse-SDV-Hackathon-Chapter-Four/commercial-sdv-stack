name: Authorization integration tests

# Brings up the infra + powertrain Compose stack from the published ghcr.io
# images, registers the SPIRE workloads, then runs the SPIFFE/JWT authorization
# matrix (tests/) against the live CDA SOVD API. The stateful #[ignore]d offline
# tests are not run here (they stop/start spire-server and launch a rogue
# container); run those manually per tests/README.md.

on:
  push:
    branches:
      - main
      - hackathon
  pull_request:
    branches:
      - main
      - hackathon
  workflow_dispatch:

# Only the latest run per ref needs to finish; cancel superseded ones.
concurrency:
  group: authz-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
  CARGO_TERM_COLOR: always
  # CDA SOVD API published port (matches .env.example / compose default).
  CDA_PORT: "20002"

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    # A cold run builds all uService images from scratch (~25 min) before the
    # stack comes up and the ~70s expiry test runs; warm (cached) runs finish
    # in a few minutes. Sized so a cold run completes and saves the layer cache.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Cache keyed on the tests/ crate.
          cache-workspaces: tests

      - name: Show Docker / Compose versions
        run: |
          docker --version
          docker compose version

      - name: Set up Docker buildx (container driver for layer cache)
        # The default docker driver can't import/export build cache; a
        # docker-container builder can. --load in the build step drops the
        # finished images into the engine store so the compose up steps below
        # find them with --no-build.
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Restore Docker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          # Key on what changes the image contents; fall back to the newest prior
          # cache so an unchanged cargo-chef dependency layer is still reused.
          key: buildx-${{ runner.os }}-${{ hashFiles('uservices/**/Cargo.toml', 'uservices/**/Cargo.lock', 'uservices/**/Dockerfile', 'ecu-sim/**/*.gradle*', 'ecu-sim/docker/Dockerfile') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build uService images (layer-cached)
        # The custom uService images are private (not anonymously pullable), so
        # they must be built here. The Dockerfiles use cargo-chef, so a warm
        # cache skips recompiling dependencies and only changed app code
        # rebuilds. Build just the powertrain services (not fw-update's
        # ecu-updater). First run is cold (~20 min); later runs reuse the cache.
        env:
          # The local cache lives in /tmp, outside the build context; allow bake
          # to touch it without the interactive entitlement prompt.
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          docker buildx bake \
            --file docker-compose.yaml \
            --set "*.cache-from=type=local,src=/tmp/.buildx-cache" \
            --set "*.cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max" \
            --load \
            fms vehicle-properties powertrain-mode-controller sovd-cda ecu-sim

      - name: Rotate build cache
        # buildx local cache grows unbounded otherwise; replace old with new.
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then mv /tmp/.buildx-cache-new /tmp/.buildx-cache; fi

      - name: Start infra profile
        # Images are either pre-built above (--load) or public (pulled on demand);
        # --no-build prevents a surprise 20-min rebuild if a tag is missing.
        run: docker compose --profile infra up -d --no-build

      - name: Wait for spire-server to accept minting
        run: |
          echo "Waiting for spire-server to be ready to mint JWT-SVIDs..."
          for i in $(seq 1 60); do
            if docker compose exec -T spire-server \
                 /opt/spire/bin/spire-server healthcheck \
                 -socketPath /run/spire/server/private/api.sock >/dev/null 2>&1; then
              echo "spire-server is healthy (after ${i}s)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::spire-server did not become healthy in time"
          docker compose logs spire-server
          exit 1

      - name: Register workloads with SPIRE
        run: scripts/register_workloads.sh

      - name: Start powertrain profile
        run: docker compose --profile infra --profile powertrain up -d --no-build

      - name: Wait for the CDA SOVD API to answer
        run: |
          url="http://localhost:${CDA_PORT}/vehicle/v15/components/blueprint-ecu"
          echo "Polling ${url} (any HTTP response, incl. 401, means the CDA is up)..."
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || echo 000)"
            if [ "$code" != "000" ]; then
              echo "CDA responded with HTTP ${code} (after ${i}s)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::CDA did not answer on :${CDA_PORT} in time"
          docker compose ps
          docker compose logs sovd-cda ecu-sim spire-agent-vehicle
          exit 1

      - name: Run authorization matrix
        env:
          STACK_DIR: ${{ github.workspace }}
        # run.sh uses the host cargo (installed above). The default run executes
        # only the non-ignored authorization tests, including the ~70s expiry
        # check. Pass --nocapture so per-test detail shows up in the CI log.
        # tee the combined output to a log the report step parses; pipefail keeps
        # the step's exit code tied to the test result rather than tee's.
        run: |
          set -o pipefail
          ./tests/run.sh --nocapture 2>&1 | tee authz-test-output.log

      - name: Publish test report
        # Render a report even when the tests fail, so the summary page shows
        # which checks passed/failed. Skipped if an earlier step bailed before
        # the tests ran (no log produced).
        if: always() && hashFiles('authz-test-output.log') != ''
        run: |
          log=authz-test-output.log
          {
            echo "## Authorization integration test report"
            echo ""
            echo "| Test | Result |"
            echo "| --- | --- |"
            grep -E '^test .+ \.\.\. (ok|FAILED|ignored)' "$log" | while read -r line; do
              name="$(printf '%s' "$line" | sed -E 's/^test (.+) \.\.\. (ok|FAILED|ignored).*/\1/')"
              res="$(printf '%s'  "$line" | sed -E 's/^test .+ \.\.\. (ok|FAILED|ignored).*/\1/')"
              case "$res" in
                ok)      icon="✅ pass" ;;
                FAILED)  icon="❌ fail" ;;
                ignored) icon="⏭️ ignored" ;;
                *)       icon="$res" ;;
              esac
              echo "| \`$name\` | $icon |"
            done || true
            echo ""
            summary="$(grep -E '^test result:' "$log" | tail -1 || true)"
            if [ -n "$summary" ]; then
              echo "**${summary#test result: }**"
            else
              echo "_No libtest summary line found — see the step log for details._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== docker compose ps ====="
          docker compose ps
          echo "===== sovd-cda ====="
          docker compose logs --no-color sovd-cda
          echo "===== spire-server ====="
          docker compose logs --no-color spire-server
          echo "===== spire-agent-vehicle ====="
          docker compose logs --no-color spire-agent-vehicle
          echo "===== ecu-sim ====="
          docker compose logs --no-color ecu-sim
          echo "===== powertrain-mode-controller ====="
          docker compose logs --no-color powertrain-mode-controller

      - name: Tear down the stack
        if: always()
        run: docker compose --profile infra --profile powertrain down -v
