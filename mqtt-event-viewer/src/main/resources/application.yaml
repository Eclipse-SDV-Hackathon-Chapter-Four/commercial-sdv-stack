spring:
  application:
    name: mqtt-event-viewer
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8090}

# All values can be overridden by environment variables, e.g. MQTT_BROKER_URI, MQTT_TOPICS_0, MQTT_BUFFER_SIZE.
mqtt:
  broker-uri: tcp://localhost:1883
  # a random suffix is appended because the client ID ends with '-'
  client-id: mqtt-event-viewer-
  topics:
    - "#"
  qos: 0
  buffer-size: 500
  max-payload-preview: 16384
  reconnect-delay: 5s

# The viewer connects as a uProtocol entity by default. Set UPROTOCOL_ENABLED=false to subscribe to the raw
# MQTT topic filters configured above instead (e.g. to also see non-uProtocol messages).
uprotocol:
  enabled: true
  # same environment variable as used by the stack's uServices
  local-uri: ${UP_LOCAL_ADDRESS:up://backend/103AB/1/0}
  rpc-enabled: true
  rpc-timeout: 5s

logging:
  level:
    org.eclipse.sdv.commercial.mqttviewer: INFO
